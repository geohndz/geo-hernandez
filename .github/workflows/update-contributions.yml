name: Update GitHub contributions

on:
  schedule:
    # Midnight America/Chicago. Actions cron is UTC, and Central time is
    # UTC-5 in daylight time and UTC-6 in standard time.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributions
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether this run is the nightly update
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=America/Chicago date +%H)
          today=$(TZ=America/Chicago date +%F)
          last=$(python3 -c "import json; print(json.load(open('content/github-contributions.json'))['days'][-1]['date'])")

          # The 05:00 UTC run is midnight during daylight time, and the
          # 06:00 UTC run is midnight during standard time. If a run is
          # late, still refresh once the snapshot is behind today's date.
          if [ "$hour" = "00" ] || [[ "$last" < "$today" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Snapshot contributions
        if: steps.gate.outputs.run == 'true'
        run: node scripts/snapshot-contributions.mjs

      - name: Commit and push snapshot
        if: steps.gate.outputs.run == 'true'
        run: |
          git add content/github-contributions.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub contributions snapshot."
          git push
